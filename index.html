<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>DJ</title>
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DJ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <h1>DJ<span class="dot">●</span></h1>
    <button id="btnPlayPause" class="round" aria-label="Lecture / pause" disabled>
      <svg viewBox="0 0 24 24" class="i-play"><path d="M7 4l13 8-13 8z"/></svg>
      <svg viewBox="0 0 24 24" class="i-pause"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
  </header>

  <section class="deck" id="deck">
    <div class="now-label">En cours</div>
    <div class="now-title" id="nowTitle">Aucune musique</div>
    <div class="now-meta" id="nowMeta">Importe tes MP3 dans la Bibliothèque pour commencer</div>
    <canvas id="wave" height="64"></canvas>
    <div class="next-line" id="nextLine"></div>
  </section>

  <section class="remix">
    <button id="btnRemix" class="remix-btn" disabled>
      <span class="remix-main">REMIX</span>
      <span class="remix-sub">passer à la suivante</span>
    </button>
    <div class="chips" id="remixStyles">
      <button data-style="auto" class="chip on">Auto</button>
      <button data-style="echo" class="chip">Écho</button>
      <button data-style="filter" class="chip">Montée</button>
      <button data-style="loop" class="chip">Boucle</button>
      <button data-style="brake" class="chip">Frein</button>
    </div>
    <div class="pads">
      <button class="pad" data-fx="echo">Écho</button>
      <button class="pad" data-fx="filter">Filtre</button>
      <button class="pad" data-fx="loop">Boucle</button>
      <button class="pad" data-fx="bass">Sans basse</button>
    </div>
  </section>

  <nav class="tabs">
    <button data-tab="queue" class="on">File d'attente</button>
    <button data-tab="library">Bibliothèque</button>
    <button data-tab="playlists">Playlists</button>
  </nav>

  <section class="panel" id="tab-queue"></section>

  <section class="panel hidden" id="tab-library">
    <label class="import">
      <input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.aac,.wav" multiple>
      <span>+ Importer des musiques</span>
    </label>
    <div class="import-status" id="importStatus"></div>
    <input type="search" id="search" class="search" placeholder="Rechercher…">
    <div id="libList"></div>
  </section>

  <section class="panel hidden" id="tab-playlists">
    <button class="wide" id="btnNewPlaylist">+ Nouvelle playlist</button>
    <div id="plList"></div>
  </section>
</div>

<div class="sheet-bg hidden" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
