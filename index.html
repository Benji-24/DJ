<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>DJ</title>
<meta name="theme-color" content="#0d1016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DJ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-jog"><div class="sp-ring"></div><div class="sp-plate"><span>DJ</span></div></div>
  <div class="sp-name">DJ</div>
  <div class="sp-by">by_ben</div>
</div>

<div id="app">
  <header class="top">
    <div class="brand"><span class="logo">DJ</span><span class="by">by_ben</span></div>
    <div class="top-right">
      <div class="seg" id="modeSeg" aria-label="Durée de chaque morceau">
        <button data-mode="full">Entier</button>
        <button data-mode="club" class="on">Club</button>
        <button data-mode="express">Express</button>
      </div>
      <button id="btnPlayPause" class="play" aria-label="Lecture / pause" disabled>
        <svg viewBox="0 0 24 24" class="i-play"><path d="M7 4.5v15l12.5-7.5z"/></svg>
        <svg viewBox="0 0 24 24" class="i-pause"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/></svg>
      </button>
    </div>
  </header>

  <section class="deck" id="deckA" data-deck="A">
    <div class="jog"><canvas class="jog-ring" width="120" height="120"></canvas><div class="jog-plate"></div><span class="jog-letter">A</span></div>
    <div class="deck-main">
      <div class="deck-row">
        <div class="deck-names"><div class="deck-title">Aucune musique</div><div class="deck-artist">Importe tes musiques</div></div>
        <div class="deck-bpm"><b>—</b><small>BPM</small></div>
      </div>
      <div class="deck-meta"></div>
      <canvas class="overview"></canvas>
    </div>
  </section>

  <section class="scope"><canvas id="scope"></canvas></section>

  <section class="deck" id="deckB" data-deck="B">
    <div class="jog"><canvas class="jog-ring" width="120" height="120"></canvas><div class="jog-plate"></div><span class="jog-letter">B</span></div>
    <div class="deck-main">
      <div class="deck-row">
        <div class="deck-names"><div class="deck-title">—</div><div class="deck-artist">Ajoute une musique à la suite</div></div>
        <div class="deck-bpm"><b>—</b><small>BPM</small></div>
      </div>
      <div class="deck-meta"></div>
      <canvas class="overview"></canvas>
    </div>
  </section>

  <section class="automix" id="automix">
    <div class="am-head">
      <span class="am-name">AutoMix</span>
      <span class="am-state" id="amState">en attente</span>
    </div>
    <div class="am-text" id="amText">Importe tes musiques, puis lance un set.</div>
    <div class="fader" id="fader" aria-hidden="true">
      <span class="fader-a">A</span>
      <div class="fader-track"><div class="fader-fill"></div><div class="fader-cap"></div></div>
      <span class="fader-b">B</span>
    </div>
    <div class="am-tags" id="amTags"></div>
  </section>

  <section class="perform">
    <button id="btnRemix" class="remix" disabled>
      <span class="remix-led"></span>
      <span class="remix-label"><b>Remix</b><small>passer à la suivante maintenant</small></span>
    </button>
    <div class="styles" id="remixStyles" aria-label="Style du remix">
      <button data-style="auto" class="on">Auto</button>
      <button data-style="echo">Écho</button>
      <button data-style="filter">Montée</button>
      <button data-style="loop">Boucle</button>
      <button data-style="brake">Frein</button>
    </div>
    <div class="pads">
      <button class="pad" data-fx="echo" style="--pad:#4da3ff"><b>Écho</b><small>un temps</small></button>
      <button class="pad" data-fx="filter" style="--pad:#b07cff"><b>Filtre</b><small>étouffer</small></button>
      <button class="pad" data-fx="loop" style="--pad:#3ddc84"><b>Boucle</b><small>une mesure</small></button>
      <button class="pad" data-fx="bass" style="--pad:#ff9a3d"><b>Basses</b><small>couper</small></button>
    </div>
  </section>

  <nav class="tabs">
    <button data-tab="queue" class="on">File d'attente</button>
    <button data-tab="library">Bibliothèque</button>
    <button data-tab="playlists">Playlists</button>
  </nav>

  <section class="panel" id="tab-queue"></section>

  <section class="panel hidden" id="tab-library">
    <label class="import">
      <input type="file" id="fileInput" multiple>
      <span>Importer des musiques</span>
      <small>MP3, M4A, WAV, MKV, MP4…</small>
    </label>
    <div class="import-status" id="importStatus"></div>
    <input type="search" id="search" class="search" placeholder="Rechercher un titre ou un artiste">
    <div id="libList"></div>
  </section>

  <section class="panel hidden" id="tab-playlists">
    <button class="wide" id="btnNewPlaylist">Nouvelle playlist</button>
    <div id="plList"></div>
  </section>

  <footer class="foot">DJ by_ben</footer>
</div>

<div class="sheet-bg hidden" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
